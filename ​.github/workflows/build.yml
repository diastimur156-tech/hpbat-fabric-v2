name: Build Fabric Mod

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack mod zip
        run: |
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP archive not found"
            exit 1
          fi
          unzip -q -o "$ZIP_FILE" -d unpacked_mod
          SRC_DIR=$(find unpacked_mod -name "build.gradle" -maxdepth 4 -exec dirname {} \; | head -n 1)
          if [ -z "$SRC_DIR" ]; then
            echo "build.gradle not found inside zip"
            exit 1
          fi
          cp -rf "$SRC_DIR"/. .

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Build mod jar
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.12
          fi
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: hpbar-mod-jar
          path: build/libs/*-1.1.0.jar
